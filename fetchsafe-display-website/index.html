<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FetchSafe – Family Information</title>
  <style>
    :root {
      --teal: #129CAE;
      --purple: #8B5CF6;
      --blue: #129CAE;
      --brand: #129CAE;
      --background: #FFFDFD;
      --ink: #111;
      --muted: #666;
      --border: #ddd;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans";
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: var(--background);
    }

    /* FetchSafe Header */
    .fetchsafe-header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    .fetchsafe-logo {
      width: 120px;
      height: 120px;
      background-image: url('logo2.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      margin: 0 auto;
    }



    /* Family Name */
    .family-name {
      text-align: center;
      font-size: 1.5em;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 30px;
    }

    /* Member Cards - Side by Side Layout */
    .members-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
      padding: 20px;
    }

    .member-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: white;
      border: 3px solid var(--brand);
      border-radius: 15px;
      padding: 25px 20px;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 20px rgba(18,156,174,0.15);
      text-align: center;
      width: 200px;
      min-height: 280px;
    }

    .member-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(18,156,174,0.2);
    }

    /* Owner/Guardian Card (Brand Color) */
    .member-card.owner {
      background: linear-gradient(135deg, var(--brand) 0%, #0f7a8a 100%);
      color: white;
      border: 3px solid var(--brand);
    }

    /* Parent Card (Brand Color Variant) */
    .member-card.parent {
      background: linear-gradient(135deg, #0f7a8a 0%, var(--brand) 100%);
      color: white;
      border: 3px solid #0f7a8a;
    }

    /* Companion Card (Brand Color Light) */
    .member-card.companion {
      background: linear-gradient(135deg, #1bb5c9 0%, var(--brand) 100%);
      color: white;
      border: 3px solid #1bb5c9;
    }

    /* Student Card (Light with dark text) */
    .member-card.student {
      background: linear-gradient(135deg, var(--background) 0%, #f0f8f9 100%);
      color: #1a1a1a;
      border: 3px solid var(--brand);
    }

    .member-avatar {
      width: 120px;
      height: 120px;
      border-radius: 15px;
      margin: 0 auto 15px auto;
      overflow: hidden;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      font-weight: bold;
      color: #495057;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.3);
    }

    .member-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .member-info {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
    }

    .member-name {
      font-size: 1.3em;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: inherit;
      line-height: 1.2;
    }

    .member-email {
      font-size: 0.9em;
      color: inherit;
      margin: 0 0 10px 0;
      opacity: 0.8;
      font-weight: 400;
    }

    .member-role {
      font-size: 0.85em;
      opacity: 0.9;
      margin: 0;
      font-weight: 600;
    }

    /* Role and Status Badges */
    .role-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: 600;
      margin: 2px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .role-owner {
      background: rgba(139, 92, 246, 0.2);
      color: #8B5CF6;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .role-parent {
      background: rgba(59, 130, 246, 0.2);
      color: #3B82F6;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .role-companion {
      background: rgba(26, 166, 160, 0.2);
      color: #1aa6a0;
      border: 1px solid rgba(26, 166, 160, 0.3);
    }

    .verification-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: 600;
      margin: 2px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .verified {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .not-verified {
      background: rgba(251, 146, 60, 0.2);
      color: #fb923c;
      border: 1px solid rgba(251, 146, 60, 0.3);
    }

    .badge-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
    }

    /* Children Section */
    .children-section {
      margin-top: 40px;
    }

    .children-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .child-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .child-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 10px auto;
      background: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .child-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .child-name {
      font-size: 1.1em;
      font-weight: 600;
      margin: 0 0 5px 0;
      color: var(--ink);
    }

    .child-grade {
      font-size: 0.9em;
      color: var(--muted);
      margin: 0;
    }

    .loading, .error {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 15px;
    }

    .loading {
      color: var(--brand);
    }

    .error {
      color: #e74c3c;
    }

    /* Row Layout Specific Styles */
    .children-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .child-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .member-card.student .child-item {
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.1);
    }

    .child-name {
      font-weight: 600;
      font-size: 0.9em;
    }



    /* Column Layout Specific Styles */
    .member-role-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.2);
      color: inherit;
      margin-top: 5px;
    }

    .children-info {
      width: 100%;
      margin-top: 15px;
    }

    .children-header {
      font-size: 1.0em;
      font-weight: bold;
      margin-bottom: 10px;
      color: inherit;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 5px;
      text-align: center;
    }

    .member-card.student .children-header,
    .member-card.student .member-role-badge {
      color: #1a1a1a;
      border-bottom-color: rgba(0,0,0,0.2);
      background: rgba(0,0,0,0.1);
    }

    /* Family Name at Bottom */
    .family-name-bottom {
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      color: var(--brand);
      margin-top: 30px;
      padding: 15px;
      background: linear-gradient(135deg, var(--background) 0%, #f0f8f9 100%);
      border: 3px solid var(--brand);
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(18,156,174,0.1);
    }

    @media (max-width: 768px) {
      .container {
        padding: 15px;
        max-width: 100%;
      }
      .members-container {
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .member-card {
        width: 250px;
        min-height: 300px;
      }

      .member-avatar {
        width: 100px;
        height: 100px;
        font-size: 40px;
      }
      .children-grid {
        grid-template-columns: 1fr;
      }
      .member-avatar {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- FetchSafe Header -->
    <div class="fetchsafe-header">
      <div class="fetchsafe-logo"></div>
    </div>

    <div id="loading" class="loading">
      <h2>🔍 Loading Family Information...</h2>
      <p>Please wait while we fetch the family details.</p>
    </div>

    <div id="error" class="error" style="display: none;">
      <h2>❌ Error Loading Family Data</h2>
      <p>Unable to load family information. Please check the QR code and try again.</p>
    </div>

    <div id="family-display" style="display: none;">
      <!-- Family content will be populated here -->
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBczGIrG5fC0sUqmd0-dMyohMEpI0JquEM",
      authDomain: "fetchsafe2.firebaseapp.com",
      projectId: "fetchsafe2",
      storageBucket: "fetchsafe2.firebasestorage.app",
      messagingSenderId: "418034723029",
      appId: "1:418034723029:web:9f9bfea5f62a159bb91a5c",
      measurementId: "G-S18Q88ZZ29"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    /**
     * Firestore rules in this repo require request.auth != null for "List Of Families", Registerd, etc.
     * This page has no login — anonymous sign-in satisfies rules so QR visitors can read family data.
     * Enable: Firebase Console → Authentication → Sign-in method → Anonymous.
     */
    window.firebaseAuthReady = signInAnonymously(auth).catch((err) => {
      console.error('Anonymous sign-in failed (enable Anonymous in Firebase Auth):', err);
      return null;
    });

    // Make Firebase available globally
    window.db = db;
    window.collection = collection;
    window.getDocs = getDocs;

  <script>
    // Get URL parameters
    function getUrlParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    /** QR / links may use ?family=, ?fam=, or ?fn= (mobile address bars often hide the value after ?fam). */
    function getFamilyNameFromUrl() {
      const params = new URLSearchParams(window.location.search);
      let raw =
        params.get('family') ||
        params.get('fam') ||
        params.get('fn') ||
        '';
      if (!raw && window.location.search.length > 1) {
        const m = window.location.search.match(/(?:^|[?&])(?:family|fam|fn)=([^&]+)/i);
        if (m) {
          try {
            raw = decodeURIComponent(m[1].replace(/\+/g, ' '));
          } catch (e) {
            raw = m[1];
          }
        }
      }
      return String(raw || '')
        .replace(/\u200b/g, '')
        .trim();
    }

    /** True if DB family string matches QR query (e.g. "Tanaka", "Tanaka Family", "The Tanaka Family"). */
    function familyDisplayMatches(storedValue, urlQuery) {
      const s = String(storedValue || '').trim().toLowerCase();
      const u = String(urlQuery || '').trim().toLowerCase();
      if (!s || !u) return false;
      if (s === u) return true;
      if (s.startsWith(u + ' ')) return true;
      const parts = s.split(/\s+/).filter(Boolean);
      if (parts[0] === u) return true;
      return parts.some((w) => w === u);
    }

    function wrapFamilyDocs(docs) {
      const list = docs || [];
      return {
        empty: list.length === 0,
        size: list.length,
        docs: list,
        forEach(fn) {
          list.forEach((d, i) => fn(d, i));
        }
      };
    }

    /**
     * List Of Families uses "Family Name" and/or "familyName". QR may send a short name (e.g. Tanaka)
     * while Firestore has "Tanaka Family" — exact == fails; prefix range + filter fixes that.
     */
    async function queryListOfFamiliesByDisplayName(familiesCollection, displayName) {
      const name = (displayName || '').trim();
      if (!name) {
        return { snapshot: wrapFamilyDocs([], ''), resolvedName: '' };
      }

      const titled = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
      const exactVariants = [...new Set([name, titled, name.toLowerCase(), name.toUpperCase()])];

      for (const v of exactVariants) {
        let q = window.query(familiesCollection, window.where('Family Name', '==', v));
        let snapshot = await window.getDocs(q);
        if (!snapshot.empty) {
          return { snapshot, resolvedName: v };
        }
        q = window.query(familiesCollection, window.where('familyName', '==', v));
        snapshot = await window.getDocs(q);
        if (!snapshot.empty) {
          return { snapshot, resolvedName: v };
        }
      }

      // Firestore string ranges are case-sensitive — scan a few prefix variants then filter in JS
      const prefixKeys = [...new Set([titled, name, name.toLowerCase(), name.toUpperCase()].filter(Boolean))];

      async function collectFromPrefix(field) {
        const seenIds = new Set();
        const out = [];
        for (const pk of prefixKeys) {
          const q = window.query(
            familiesCollection,
            window.where(field, '>=', pk),
            window.where(field, '<=', pk + '\uf8ff')
          );
          const snap = await window.getDocs(q);
          snap.forEach((doc) => {
            if (seenIds.has(doc.id)) return;
            const d = doc.data();
            const val = String(d[field] || '').trim();
            if (familyDisplayMatches(val, name)) {
              seenIds.add(doc.id);
              out.push(doc);
            }
          });
        }
        return out;
      }

      let docs = await collectFromPrefix('Family Name');
      if (!docs.length) {
        docs = await collectFromPrefix('familyName');
      }

      if (docs.length) {
        const d0 = docs[0].data();
        const resolved = String(d0['Family Name'] || d0['familyName'] || name).trim();
        return { snapshot: wrapFamilyDocs(docs), resolvedName: resolved };
      }

      return { snapshot: wrapFamilyDocs([], name), resolvedName: name };
    }

    /** Registerd / Join Requests use one string; prefer the value stored on the family row. */
    function canonicalFamilyNameForQueries(familySnapshot, fallback) {
      if (!familySnapshot.docs || !familySnapshot.docs.length) {
        return (fallback || '').trim();
      }
      const d = familySnapshot.docs[0].data();
      return (
        (d['Family Name'] || d['familyName'] || fallback || '') + ''
      ).trim();
    }

    // Get first letter for avatar
    function getInitials(name) {
      if (!name) return '?';
      return name.split(' ').map(word => word[0]).join('').toUpperCase().substring(0, 2);
    }

    // Format role for display
    function formatRole(role) {
      const roleMap = {
        'owner': { text: 'Owner 👑', class: 'role-owner' },
        'parent': { text: 'Parent 👨‍👩‍👧‍👦', class: 'role-parent' },
        'companion': { text: 'Companion 👤', class: 'role-companion' }
      };
      return roleMap[role?.toLowerCase()] || { text: 'Member', class: 'role-companion' };
    }

    // Format date
    function formatDate(dateInput) {
      if (!dateInput) return 'Unknown';
      try {
        const date = new Date(dateInput);
        return date.toLocaleDateString();
      } catch {
        return 'Unknown';
      }
    }

    // Fetch family data from Firebase using family name as foreign key
    async function fetchFamilyFromFirebase(familyName, authorizerEmail) {
      try {
        console.log('🔍 Fetching family data for:', familyName);
        console.log('👤 Filtering for authorizer:', authorizerEmail);
        console.log('🏠 FAMILY-SPECIFIC DATA FETCH - Only data for family "' + familyName + '" will be loaded');

        // Check if Firebase is initialized
        if (!window.db) {
          throw new Error('Firebase not initialized');
        }

        console.log('✅ Firebase initialized successfully');

        // Initialize collections first
        const familiesCollection = window.collection(window.db, 'List Of Families');
        const registeredCollection = window.collection(window.db, 'Registerd');
        const joinRequestsCollection = window.collection(window.db, 'Join Requests');

        // Match Angular app + mixed Firestore field names
        const { snapshot: familySnapshot, resolvedName } = await queryListOfFamiliesByDisplayName(
          familiesCollection,
          familyName
        );

        if (familySnapshot.empty) {
          throw new Error(`No family found with name: ${resolvedName}`);
        }

        const effectiveFamilyName = resolvedName;
        console.log('✅ Found family data for:', effectiveFamilyName, '- Documents:', familySnapshot.size);

        const registerdFamilyKey = canonicalFamilyNameForQueries(familySnapshot, effectiveFamilyName);
        console.log('🔑 Using family key for Registerd / join queries:', registerdFamilyKey);

        const familyMembers = [];
        const children = [];
        let familyCreator = null;
        let authorizerUID = null;
        let restrictParentRowsToAuthorizer = false;

        // Resolve authorizer when QR includes &authorizer=email (must exist in Registerd to enforce filtering)
        if (authorizerEmail) {
          const authorizerQuery = window.query(registeredCollection, window.where('email', '==', authorizerEmail));
          const authorizerSnapshot = await window.getDocs(authorizerQuery);
          if (!authorizerSnapshot.empty) {
            authorizerUID = authorizerSnapshot.docs[0].data()['uid'];
            restrictParentRowsToAuthorizer = true;
            console.log('🔑 Found authorizer UID:', authorizerUID);
          } else {
            console.log('⚠️ Authorizer email not in Registerd — showing all adults on this family (no privacy filter)');
          }
        } else {
          console.log('ℹ️ No authorizer param — showing all adults on this family');
        }

        console.log('🎯 Authorizer:', authorizerEmail, 'UID:', authorizerUID, 'filter:', restrictParentRowsToAuthorizer);

        // First, get all joined members to know who to include
        const joinedMemberUIDs = new Set();
        const joinedMemberEmails = new Set();

        const nameKeysForJoin = [...new Set([registerdFamilyKey, effectiveFamilyName].map((s) => (s || '').trim()).filter(Boolean))];
        for (const nk of nameKeysForJoin) {
          const tempJoinedQuery = window.query(registeredCollection, window.where('familyName', '==', nk));
          const tempJoinedSnapshot = await window.getDocs(tempJoinedQuery);
          tempJoinedSnapshot.forEach((doc) => {
            const userData = doc.data();
            if (userData['familyRole']) {
              if (userData['uid']) joinedMemberUIDs.add(userData['uid']);
              if (userData['email']) joinedMemberEmails.add(userData['email']);
            }
          });

          const tempApprovedQuery = window.query(
            joinRequestsCollection,
            window.where('familyName', '==', nk),
            window.where('status', '==', 'approved')
          );
          const tempApprovedSnapshot = await window.getDocs(tempApprovedQuery);
          tempApprovedSnapshot.forEach((doc) => {
            const requestData = doc.data();
            if (requestData['requesterId']) joinedMemberUIDs.add(requestData['requesterId']);
            if (requestData['requesterEmail']) joinedMemberEmails.add(requestData['requesterEmail']);
          });
        }

        console.log('👥 Joined member UIDs:', Array.from(joinedMemberUIDs));
        console.log('📧 Joined member emails:', Array.from(joinedMemberEmails));

        // Process each document in the family - SHOW AUTHORIZER + ALL JOINED MEMBERS
        familySnapshot.forEach((doc) => {
          const data = doc.data();
          console.log('📄 Processing family document:', data);

          const documentUID = data['uid'] || '';
          const documentEmail = data['Parent Email'] || data['parentEmail'] || '';

          console.log('🔍 Checking document - UID:', documentUID, 'Email:', documentEmail);

          // Check if this document belongs to the authorizer OR any joined member
          const isAuthorizerData = (authorizerUID && documentUID === authorizerUID) ||
                                   (authorizerEmail && documentEmail === authorizerEmail);
          const isJoinedMemberData = joinedMemberUIDs.has(documentUID) || joinedMemberEmails.has(documentEmail);

          console.log('🔎 Is authorizer data?', isAuthorizerData);
          console.log('🔎 Is joined member data?', isJoinedMemberData);

          // ALWAYS extract child information from ALL family documents (field names vary by app version)
          const childsName =
            data['Childs Name'] || data['childsName'] || data['childName'] || data['Child Name'] || '';
          if (childsName && String(childsName).trim() !== '') {
            children.push({
              name: childsName,
              grade: data['Grade Level'] || data['gradeLevel'] || 'Not specified',
              profilePicture: data['Child Profile Picture'] || data['childProfilePicture'] || '',
              hasProfilePicture: !!((data['Child Profile Picture'] || data['childProfilePicture'] || '').trim()),
              isVerified: data['Child Verified'] === true || data['childVerified'] === true || data['Verification Status'] === 'verified',
              verificationStatus: data['Verification Status'] || (data['Child Verified'] === true ? 'verified' : 'not_verified'),
              parentUID: data['uid'] || data['parentUid'] || ''
            });
          }

          // Only filter adults when we resolved the authorizer in Registerd (QR with valid email)
          if (restrictParentRowsToAuthorizer && !isAuthorizerData && !isJoinedMemberData) {
            console.log('⏭️ Skipping parent row (not authorizer / joined member)');
            return;
          }

          console.log('✅ Processing family member data');

          if (data['Parent Full Name']) {
            const member = {
              name: data['Parent Full Name'],
              email: data['Parent Email'] || '',
              contactNumber: data['Parent Contact Number'] || '',
              profilePicture: data['Parent Profile Picture'] || '',
              hasProfilePicture: !!(data['Parent Profile Picture'] && data['Parent Profile Picture'].trim()),
              role: data['Role'] || 'companion',
              joinedDate: data['Date Created'] || new Date(),
              uid: data['uid'] || '',
              isOriginalCreator: false
            };

            // Check if this is the family creator
            if (data['Name of the Creator'] === data['Parent Full Name']) {
              member.role = 'owner';
              member.isOriginalCreator = true;
              familyCreator = member;
            }

            familyMembers.push(member);
          }
        });

        // Remove duplicates based on email or name
        const uniqueMembers = familyMembers.filter((member, index, self) =>
          index === self.findIndex(m => m.email === member.email || m.name === member.name)
        );

        const uniqueChildren = children.filter((child, index, self) =>
          index === self.findIndex(c => c.name === child.name)
        );

        // Also check for joined family members in "Registerd" collection
        console.log('🔍 Searching for joined members in family (keys):', nameKeysForJoin.join(', '));

        const seenJoinedRegisterd = new Set();
        for (const nk of nameKeysForJoin) {
          const joinedMembersQuery = window.query(registeredCollection, window.where('familyName', '==', nk));
          const joinedMembersSnapshot = await window.getDocs(joinedMembersQuery);
          console.log('📊 Registerd docs for familyName', nk, ':', joinedMembersSnapshot.size);

          joinedMembersSnapshot.forEach((doc) => {
            if (seenJoinedRegisterd.has(doc.id)) return;
            const userData = doc.data();
            if (userData['familyRole'] && userData['fullName']) {
              seenJoinedRegisterd.add(doc.id);
              console.log('🔍 Adding joined member - UID:', userData['uid'], 'Email:', userData['email'], 'Role:', userData['familyRole']);

              const existingMember = uniqueMembers.find(m =>
                m.email === userData['email'] || m.name === userData['fullName'] || m.uid === userData['uid']
              );

              if (!existingMember) {
                const joinedMember = {
                  name: userData['fullName'],
                  email: userData['email'] || '',
                  contactNumber: userData['contactNumber'] || '',
                  profilePicture: userData['profilePicture'] || '',
                  hasProfilePicture: !!(userData['profilePicture'] && userData['profilePicture'].trim()),
                  role: userData['familyRole'] || 'companion',
                  joinedDate: userData['joinedFamilyDate'] || userData['Date Created'] || new Date(),
                  uid: userData['uid'] || '',
                  isJoinedMember: true
                };

                uniqueMembers.push(joinedMember);
                console.log('✅ Added joined member from Registerd:', joinedMember.name, 'Role:', joinedMember.role);
              }
            }
          });
        }

        // Also check "Join Requests" collection for approved requests (backup check)
        const seenJoinRequestDoc = new Set();
        for (const nk of nameKeysForJoin) {
          console.log('🔍 Approved join requests for familyName:', nk);
          const approvedRequestsQuery = window.query(
            joinRequestsCollection,
            window.where('familyName', '==', nk),
            window.where('status', '==', 'approved')
          );
          const approvedRequestsSnapshot = await window.getDocs(approvedRequestsQuery);
          console.log('📊 Approved join requests:', approvedRequestsSnapshot.size);

          approvedRequestsSnapshot.forEach((doc) => {
            if (seenJoinRequestDoc.has(doc.id)) return;
            seenJoinRequestDoc.add(doc.id);
            const requestData = doc.data();
            if (requestData['requesterId'] && requestData['requesterName']) {
              console.log('🔍 Adding approved join request member - UID:', requestData['requesterId'], 'Email:', requestData['requesterEmail'], 'Role:', requestData['requestedRole']);

              const existingMember = uniqueMembers.find(m =>
                m.email === requestData['requesterEmail'] ||
                m.name === requestData['requesterName'] ||
                m.uid === requestData['requesterId']
              );

              if (!existingMember) {
                const approvedMember = {
                  name: requestData['requesterName'],
                  email: requestData['requesterEmail'] || '',
                  contactNumber: requestData['requesterContact'] || '',
                  profilePicture: requestData['requesterProfilePicture'] || '',
                  hasProfilePicture: !!(requestData['requesterProfilePicture'] && requestData['requesterProfilePicture'].trim()),
                  role: requestData['requestedRole'] || 'companion',
                  joinedDate: requestData['approvedAt'] || requestData['createdAt'] || new Date(),
                  uid: requestData['requesterId'] || '',
                  isJoinedMember: true,
                  isFromJoinRequest: true
                };

                uniqueMembers.push(approvedMember);
                console.log('✅ Added authorizer from approved join request:', approvedMember.name, 'Role:', approvedMember.role);
              }
            }
          });
        }

        return {
          familyName: registerdFamilyKey || effectiveFamilyName,
          familyMembers: uniqueMembers,
          children: uniqueChildren,
          familyCreator: familyCreator
        };

      } catch (error) {
        console.error('❌ Error fetching family from Firebase:', error);
        throw error;
      }
    }

    // Show manual family name input form
    window.showFamilyNameInput = function() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('family-display').innerHTML = `
        <div style="text-align: center; padding: 40px; max-width: 500px; margin: 0 auto;">
          <h2 style="color: #333; margin-bottom: 20px;">Enter Family Name</h2>
          <p style="color: #666; margin-bottom: 30px;">Please enter the family name to view family information:</p>
          <div style="margin-bottom: 20px;">
            <input type="text" id="familyNameInput" placeholder="Enter family name"
                   style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 10px;">
            <input type="email" id="authorizerEmailInput" placeholder="Enter your email (optional)"
                   style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px;">
          </div>
          <button onclick="window.loadFamilyManually()"
                  style="background: #007bff; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; cursor: pointer;">
            Load Family Data
          </button>
        </div>
      `;
    }

    // Load family data manually
    window.loadFamilyManually = async function() {
      const familyName = document.getElementById('familyNameInput').value.trim();
      const authorizerEmail = document.getElementById('authorizerEmailInput').value.trim() || 'manual@entry.com';

      if (!familyName) {
        alert('Please enter a family name');
        return;
      }

      // Show loading
      document.getElementById('family-display').innerHTML = '<div style="text-align: center; padding: 40px;">Loading family data...</div>';

      try {
        // Fetch family data from Firebase
        const familyData = await fetchFamilyFromFirebase(familyName, authorizerEmail);

        // Display the family data
        const familyHtml = buildFamilyDisplay(familyData);
        document.getElementById('family-display').innerHTML = familyHtml;

        console.log('✅ Family data loaded successfully');
      } catch (error) {
        console.error('❌ Error loading family data:', error);
        document.getElementById('family-display').innerHTML = `
          <div style="text-align: center; padding: 40px; color: #dc3545;">
            <h3>Error Loading Family Data</h3>
            <p>${error.message}</p>
            <button onclick="window.showFamilyNameInput()" style="background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
              Try Again
            </button>
          </div>
        `;
      }
    }

    // Display family data
    async function displayFamilyData() {
      try {
        const familyName = getFamilyNameFromUrl();
        const authorizerEmail = (getUrlParameter('authorizer') || '').trim();

        console.log('🔗 Current URL:', window.location.href);
        console.log('🔗 URL Search:', window.location.search);
        console.log('📝 Family name from URL:', familyName);
        console.log('📧 Authorizer email from URL:', authorizerEmail);

        if (!familyName) {
          // Show manual family name input form
          window.showFamilyNameInput();
          return;
        }

        console.log('🔍 Loading family:', familyName);
        console.log('👤 Authorized by:', authorizerEmail);

        // Fetch family data from Firebase using family name as foreign key
        const familyData = await fetchFamilyFromFirebase(familyName, authorizerEmail);

        // Hide loading and show content
        document.getElementById('loading').style.display = 'none';
        document.getElementById('family-display').style.display = 'block';

        // Build the family display
        buildFamilyDisplay(familyData);

      } catch (error) {
        console.error('❌ Error loading family data:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';

        // Show specific error message
        const errorDiv = document.getElementById('error');
        errorDiv.innerHTML = `
          <h2>❌ Error Loading Family Data</h2>
          <p>${error.message}</p>
          <p>Please check the QR code and try again.</p>
        `;
      }
    }

    // Build family display
    function buildFamilyDisplay(familyData) {
      const container = document.getElementById('family-display');

      let html = `
        <!-- Family Name -->
        <div class="family-name">
          🏠 ${familyData.familyName || 'Unknown Family'}
        </div>

        <!-- Family Members Container -->
        <div class="members-container">
      `;

      // Process family members by role
      const owners = [];
      const parents = [];
      const companions = [];
      const students = [];

      if (familyData.familyMembers && familyData.familyMembers.length > 0) {
        familyData.familyMembers.forEach(member => {
          switch(member.role) {
            case 'owner':
              owners.push(member);
              break;
            case 'parent':
              parents.push(member);
              break;
            case 'companion':
              companions.push(member);
              break;
            default:
              students.push(member);
          }
        });
      }

      // Add owner cards (purple)
      owners.forEach(member => {
        html += `
          <div class="member-card owner">
            <div class="member-avatar">
              ${member.profilePicture && member.profilePicture.trim() ?
                `<img src="${member.profilePicture.startsWith('data:') ? member.profilePicture : 'data:image/jpeg;base64,' + member.profilePicture}" alt="${member.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='${getInitials(member.name)}';">` :
                getInitials(member.name)
              }
            </div>
            <div class="member-info">
              <h3 class="member-name">${member.name || 'Unknown'}</h3>
              <div class="member-email">${member.email || 'No email'}</div>
              <span class="member-role-badge">👑 Guardian${member.isJoinedMember ? ' (Joined)' : ' (Creator)'}</span>
            </div>
            ${member.children && member.children.length > 0 ? `
              <div class="children-info">
                <div class="children-header">Children (${member.children.length})</div>
                <div class="children-list">
                  ${member.children.map(child => `
                    <div class="child-item">
                      <span class="child-name">${child.name}</span>
                      <span class="verification-badge ${child.verified ? 'verified' : 'pending'}">
                        ${child.verified ? '✅ Verified' : '⏳ Pending'}
                      </span>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      });

      // Add parent cards (blue)
      parents.forEach(member => {
        html += `
          <div class="member-card parent">
            <div class="member-avatar">
              ${member.profilePicture && member.profilePicture.trim() ?
                `<img src="${member.profilePicture.startsWith('data:') ? member.profilePicture : 'data:image/jpeg;base64,' + member.profilePicture}" alt="${member.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='${getInitials(member.name)}';">` :
                getInitials(member.name)
              }
            </div>
            <div class="member-info">
              <h3 class="member-name">${member.name || 'Unknown'}</h3>
              <div class="member-email">${member.email || 'No email'}</div>
              <span class="member-role-badge">👨‍👩‍👧‍👦 Parent${member.isJoinedMember ? ' (Joined)' : ''}</span>
            </div>
            ${member.children && member.children.length > 0 ? `
              <div class="children-info">
                <div class="children-header">Children (${member.children.length})</div>
                <div class="children-list">
                  ${member.children.map(child => `
                    <div class="child-item">
                      <span class="child-name">${child.name}</span>
                      <span class="verification-badge ${child.verified ? 'verified' : 'pending'}">
                        ${child.verified ? '✅ Verified' : '⏳ Pending'}
                      </span>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      });

      // Add companion cards (teal)
      companions.forEach(member => {
        html += `
          <div class="member-card companion">
            <div class="member-avatar">
              ${member.profilePicture && member.profilePicture.trim() ?
                `<img src="${member.profilePicture.startsWith('data:') ? member.profilePicture : 'data:image/jpeg;base64,' + member.profilePicture}" alt="${member.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='${getInitials(member.name)}';">` :
                getInitials(member.name)
              }
            </div>
            <div class="member-info">
              <h3 class="member-name">${member.name || 'Unknown'}</h3>
              <div class="member-email">${member.email || 'No email'}</div>
              <span class="member-role-badge">👤 Companion${member.isJoinedMember ? ' (Joined)' : ''}</span>
            </div>
            ${member.children && member.children.length > 0 ? `
              <div class="children-info">
                <div class="children-header">Children (${member.children.length})</div>
                <div class="children-list">
                  ${member.children.map(child => `
                    <div class="child-item">
                      <span class="child-name">${child.name}</span>
                      <span class="verification-badge ${child.verified ? 'verified' : 'pending'}">
                        ${child.verified ? '✅ Verified' : '⏳ Pending'}
                      </span>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      });

      // Add student cards (if any family members are marked as students)
      students.forEach(member => {
        html += `
          <div class="member-card student">
            <div class="member-avatar">
              ${member.profilePicture && member.profilePicture.trim() ?
                `<img src="${member.profilePicture.startsWith('data:') ? member.profilePicture : 'data:image/jpeg;base64,' + member.profilePicture}" alt="${member.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='${getInitials(member.name)}';">` :
                getInitials(member.name)
              }
            </div>
            <div class="member-info">
              <h3 class="member-name">${member.name || 'Unknown'}</h3>
              <div class="member-email">${member.email || 'No email'}</div>
              <span class="member-role-badge">🎓 Student</span>
            </div>
          </div>
        `;
      });

      // Add children as student cards with verification status
      if (familyData.children && familyData.children.length > 0) {
        familyData.children.forEach(child => {
          const verificationBadge = child.isVerified
            ? '<span class="verification-badge verified">✅ Verified</span>'
            : '<span class="verification-badge not-verified">⏳ Pending</span>';

          html += `
            <div class="member-card student">
              <div class="member-avatar">
                ${child.profilePicture && child.profilePicture.trim() ?
                  `<img src="${child.profilePicture.startsWith('data:') ? child.profilePicture : 'data:image/jpeg;base64,' + child.profilePicture}" alt="${child.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='${getInitials(child.name)}';">` :
                  getInitials(child.name)
                }
              </div>
              <div class="member-info">
                <h3 class="member-name">${child.name || 'Unknown'}</h3>
                <div class="member-email">${child.grade || 'Student'}</div>
                <span class="member-role-badge">👶 Student</span>
                ${verificationBadge}
              </div>
            </div>
          `;
        });
      }

      html += `
        </div>

        <!-- Family Name at Bottom -->
        <div class="family-name-bottom">
          ${familyData.familyName || 'Unknown Family'}
        </div>
      `;

      container.innerHTML = html;
    }

    // Start after Firestore is allowed (anonymous auth completes when rules require it)
    async function start() {
      console.log('🚀 FetchSafe Family Portal starting...');
      if (window.firebaseAuthReady) {
        await window.firebaseAuthReady;
      }
      displayFamilyData();
    }

    document.addEventListener('DOMContentLoaded', () => {
      start().catch((e) => console.error(e));
    });
  </script>
</body>
