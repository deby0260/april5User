<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FetchSafe - Family Pickup Authorization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0e7ec9, #0056b3);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #20b2aa;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
            padding: 25px;
            border-radius: 15px;
            background: #f8f9fa;
            border-left: 5px solid #20b2aa;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info, .family-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .profile-picture {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #20b2aa;
            margin-bottom: 15px;
        }

        .children-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .child-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .child-card:hover {
            transform: translateY(-5px);
        }

        .child-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #20b2aa;
            margin-bottom: 15px;
        }

        .placeholder-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #20b2aa, #17a2b8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            margin: 0 auto 15px;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .metadata {
            background: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-verified {
            background: #d4edda;
            color: #155724;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .content {
                padding: 20px;
            }
            
            .user-info, .family-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <div class="logo-icon">🛡️</div>
                FetchSafe
            </h1>
            <p>Family Pickup Authorization System</p>
            <div class="status-badge status-verified">✓ Verified QR Code</div>
        </div>

        <div class="content" id="content">
            <div class="loading">
                <h2>Loading family data...</h2>
                <p>Please wait while we verify and display the family information.</p>
            </div>
        </div>
    </div>

    <script>
        // Function to get URL parameters
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Function to decode and display family data
        function displayFamilyData() {
            try {
                const encodedData = getUrlParameter('data');
                if (!encodedData) {
                    throw new Error('No family data found in URL');
                }

                // Decode the base64 data
                const decodedData = atob(decodeURIComponent(encodedData));
                const familyData = JSON.parse(decodedData);

                console.log('Received family data:', familyData);

                // Generate HTML content
                let html = '';

                // Authorizer Information
                html += `
                    <div class="section">
                        <h2>👤 Authorized By</h2>
                        <div class="user-info">
                            <div class="info-card">
                                ${familyData.authorizer.profilePicture ? 
                                    `<img src="${familyData.authorizer.profilePicture}" alt="Profile" class="profile-picture">` :
                                    `<div class="placeholder-photo">${familyData.authorizer.fullName.charAt(0)}</div>`
                                }
                                <h3>${familyData.authorizer.fullName}</h3>
                                <p><strong>Email:</strong> ${familyData.authorizer.email}</p>
                                <p><strong>Phone:</strong> ${familyData.authorizer.contactNumber}</p>
                            </div>
                        </div>
                    </div>
                `;

                // Family Information
                html += `
                    <div class="section">
                        <h2>👨‍👩‍👧‍👦 Family: ${familyData.familyName}</h2>
                        <div class="family-info">
                `;

                // Family Members
                if (familyData.familyMembers && familyData.familyMembers.length > 0) {
                    familyData.familyMembers.forEach(member => {
                        html += `
                            <div class="info-card">
                                ${member.profilePicture ? 
                                    `<img src="${member.profilePicture}" alt="Profile" class="profile-picture">` :
                                    `<div class="placeholder-photo">${member.name.charAt(0)}</div>`
                                }
                                <h4>${member.name}</h4>
                                <p><strong>Role:</strong> ${member.role}</p>
                                <p><strong>Email:</strong> ${member.email}</p>
                                <p><strong>Phone:</strong> ${member.contactNumber}</p>
                            </div>
                        `;
                    });
                }

                html += `</div></div>`;

                // Children Information
                if (familyData.children && familyData.children.length > 0) {
                    html += `
                        <div class="section">
                            <h2>👶 Children (${familyData.children.length})</h2>
                            <div class="children-grid">
                    `;

                    familyData.children.forEach(child => {
                        html += `
                            <div class="child-card">
                                ${child.profilePicture ? 
                                    `<img src="${child.profilePicture}" alt="${child.name}" class="child-photo">` :
                                    `<div class="placeholder-photo">${child.name.charAt(0)}</div>`
                                }
                                <h3>${child.name}</h3>
                                <p><strong>Grade:</strong> ${child.grade}</p>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                } else {
                    html += `
                        <div class="section">
                            <h2>👶 Children</h2>
                            <p>No children information available.</p>
                        </div>
                    `;
                }

                // Metadata
                html += `
                    <div class="section">
                        <h2>📋 Verification Details</h2>
                        <div class="metadata">
                            <p><strong>Generated:</strong> ${new Date(familyData.metadata.generatedAt).toLocaleString()}</p>
                            <p><strong>Session ID:</strong> ${familyData.metadata.sessionId}</p>
                            <p><strong>App Version:</strong> ${familyData.metadata.version}</p>
                            <p><strong>Purpose:</strong> ${familyData.metadata.purpose}</p>
                        </div>
                    </div>
                `;

                document.getElementById('content').innerHTML = html;

            } catch (error) {
                console.error('Error displaying family data:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error-message">
                        <h2>Error Loading Family Data</h2>
                        <p>Unable to decode or display the family information. Please ensure you have a valid QR code.</p>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        // Load family data when page loads
        window.addEventListener('load', displayFamilyData);
    </script>
</body>
</html>
