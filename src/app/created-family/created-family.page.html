<ion-content [fullscreen]="true" class="created-family-page" [scrollY]="true">
  <div class="page-container">
    <div *ngIf="isLoading" class="loading-section">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading family data...</p>
    </div>

    <p class="offline-page-hint" *ngIf="showingOfflineFamily && !isLoading">Offline mode</p>
    <div *ngIf="!isLoading" class="family-info-section">
      <h1 class="family-name">{{ familyData.familyName }}</h1>
      <p class="created-date" *ngIf="familyData.createdDate">Created on {{ familyData.createdDate }}</p>
    </div>

    <div *ngIf="!isLoading" class="family-members-section">
      <h3 class="section-title">Family Members</h3>

      <div class="members-list">
        <div *ngFor="let member of familyData.members" class="member-item">
          <div class="member-avatar">
            <img
              *ngIf="member.profilePicture && !memberPhotoBroken[member.uid || member.email || member.name]"
              [src]="member.profilePicture"
              [alt]="member.name"
              class="member-photo"
              (error)="onMemberPhotoError(member)">
            <ion-icon
              *ngIf="!member.profilePicture"
              name="person-circle"
              class="avatar-icon">
            </ion-icon>
          </div>
          <div class="member-info">
            <h4 class="member-name">{{ member.name }}</h4>
            <p class="member-contact">{{ member.email }}</p>
            <p class="member-phone">{{ member.contactNumber }}</p>
            <ion-chip [color]="getRoleColor(member.role)" class="role-chip">
              {{ getRoleDisplayName(member.role) }}
            </ion-chip>
          </div>
          <div class="member-actions" *ngIf="canManageFamily && member.role !== 'owner' && !isCurrentUser(member)">
            <ion-button
              fill="clear"
              size="small"
              (click)="changeRole(member)"
              class="action-button"
              [title]="'Change ' + member.name + '\'s role'">
              <ion-icon name="settings-outline"></ion-icon>
            </ion-button>
            <ion-button
              fill="clear"
              size="small"
              color="danger"
              (click)="removeMember(member)"
              class="action-button remove-button"
              [title]="'Remove ' + member.name + ' from family'">
              <ion-icon name="trash-outline"></ion-icon>
            </ion-button>
          </div>
        </div>

        <div *ngIf="familyData.children.length > 0" class="children-section">
          <h4 class="children-title">Children</h4>

          <div *ngFor="let child of familyData.children" class="member-item child-item">
            <div class="member-avatar">
              <img
                *ngIf="child.profilePicture && !childPhotoBroken[child.name]"
                [src]="child.profilePicture"
                [alt]="child.name"
                class="child-photo"
                (error)="onChildPhotoError(child.name)">
              <ion-icon
                *ngIf="!child.profilePicture"
                name="person-circle"
                class="avatar-icon"></ion-icon>
            </div>
            <div class="member-info">
              <h4 class="member-name">{{ child.name }}</h4>
              <p class="member-role">{{ child.gradeLevel }}</p>
            </div>
          </div>
        </div>


      </div>
    </div>

  </div>
</ion-content>
