<ion-content [fullscreen]="true" class="consent-letter-page" [scrollY]="true">
  <div class="page-container">

    <div class="header-section">
      <ion-button fill="clear" class="back-button" (click)="goBack()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>

      <div class="logo">
        <img src="assets/logo2.png" alt="FetchSafe logo" />
      </div>
    </div>

    <div class="title-section">
      <h1>Consent Letter</h1>
    </div>

    <div class="form-section">
      <div class="input-group">
        <label class="input-label">Letter</label>
        <ion-textarea
          placeholder="I hereby authorize [Child's Name] to pick up my child [Child's Name] today."
          [(ngModel)]="consentData.letter"
          rows="6"
          class="letter-textarea">
        </ion-textarea>
      </div>


      <div class="input-group">
        <label class="input-label">Parent/Guardian Signature</label>
        <div class="signature-container">
          <canvas
            #signatureCanvas
            class="signature-canvas"
            width="300"
            height="120">
          </canvas>
          <div class="signature-controls">
            <ion-button
              fill="clear"
              size="small"
              class="clear-signature-btn"
              (click)="clearSignature()">
              <ion-icon name="refresh" slot="start"></ion-icon>
              Clear
            </ion-button>
          </div>
        </div>
      </div>


      <div class="toggle-section">
        <div class="toggle-item">
          <span class="toggle-label">Emergency Fetcher</span>
          <ion-toggle
            [(ngModel)]="consentData.emergencyFetcher"
            class="custom-toggle">
          </ion-toggle>
        </div>

        <div class="toggle-item">
          <span class="toggle-label">One time Fetcher</span>
          <ion-toggle
            [(ngModel)]="consentData.oneTimeFetcher"
            class="custom-toggle">
          </ion-toggle>
        </div>
      </div>


      <div class="date-info-section">
        <div class="date-item">
          <span class="date-label">Date Issued:</span>
          <span class="date-value">{{ consentData.dateIssued | date:'MMM dd, yyyy' }}</span>
        </div>
        <div class="date-item">
          <span class="date-label">Valid Until:</span>
          <span class="date-value">{{ consentData.validUntil }}</span>
        </div>
      </div>


      <div class="action-section">
        <ion-button
          expand="block"
          class="save-button"
          [disabled]="isSaving"
          (click)="saveConsentLetter()">
          <ion-spinner *ngIf="isSaving" name="crescent"></ion-spinner>
          <span *ngIf="!isSaving">Save</span>
          <span *ngIf="isSaving">Saving...</span>
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>


<app-bottom-navigation></app-bottom-navigation>
