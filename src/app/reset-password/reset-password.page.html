<ion-content [fullscreen]="true" class="reset-password-page">
  <div class="page-container">
    <div class="logo-section">
      <div class="logo">
        <img src="assets/logo2.png" alt="FetchSafe logo" />
      </div>
    </div>

    <div class="title-section">
      <h1>{{ resetComplete ? 'Password Updated' : 'Create New Password' }}</h1>
      <p class="subtitle" *ngIf="codeValid && !resetComplete">
        Enter a new password for <strong>{{ email }}</strong>
      </p>
      <p class="subtitle error-text" *ngIf="codeError && !codeValid">
        {{ codeError }}
      </p>
    </div>

    <div class="form-section" *ngIf="codeValid && !resetComplete">
      <div class="input-group">
        <div class="input-container password-input-container">
          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="New password"
            [(ngModel)]="newPassword"
            class="password-input"
            [class.error]="formError"
            (keyup.enter)="submitNewPassword()">
          </ion-input>
          <ion-button
            fill="clear"
            type="button"
            class="toggle-button"
            (click)="togglePasswordVisibility($event)"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </div>

        <div class="input-container password-input-container">
          <ion-input
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Confirm new password"
            [(ngModel)]="confirmPassword"
            class="password-input"
            [class.error]="formError"
            (keyup.enter)="submitNewPassword()">
          </ion-input>
          <ion-button
            fill="clear"
            type="button"
            class="toggle-button"
            (click)="toggleConfirmPasswordVisibility($event)"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
            <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </div>

        <div class="error-message" *ngIf="formError">
          <ion-icon name="alert-circle"></ion-icon>
          {{ formError }}
        </div>
      </div>

      <ion-button expand="block" class="submit-button" (click)="submitNewPassword()">
        Save New Password
      </ion-button>
    </div>

    <div class="action-section">
      <ion-button
        expand="block"
        fill="outline"
        class="login-button"
        (click)="goToLogin($event)">
        <ion-icon name="arrow-back" slot="start"></ion-icon>
        Back to Login
      </ion-button>

      <a
        href="#"
        class="forgot-link"
        *ngIf="!codeValid"
        (click)="goToForgotPassword($event)">
        Request a new reset link
      </a>
    </div>
  </div>
</ion-content>
